# NOTE: This file is documentation-only for the current project.
# The active Gazebo launch in launch/gazebo.launch.xml does NOT load this YAML file.
# Instead, it creates the ROS-GZ bridge directly with the `ros_gz_bridge parameter_bridge`
# node and the command-line topic mapping arguments.
#
# This file is kept here as a reference for the topic mappings used in the project:
#   - /clock -> rosgraph_msgs/msg/Clock
#   - /joint_states -> sensor_msgs/msg/JointState
#   - /tf -> tf2_msgs/msg/TFMessage
#   - /cmd_vel -> geometry_msgs/msg/Twist
#
# Format notes:
# - direction: GZ_TO_ROS means Gazebo -> ROS
# - direction: ROS_TO_GZ means ROS -> Gazebo
#
# This file is intentionally not used by the launch configuration at the moment.
# The working launch uses the inline `args` string in launch/gazebo.launch.xml.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name: /tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
