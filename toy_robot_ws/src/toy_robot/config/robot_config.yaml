brain_node:
  ros__parameters:
    # TF frame names
    source_frame: camera_link
    target_frame: map

    # Timers and thresholds
    cycle_time_ms: 2000
    tf_timeout_ms: 1000
    stop_distance: 0.3
    pick_distance_threshold: 0.4
    pick_distance_margin: 0.15
    max_pick_reapproach_attempts: 3

    # Search spin behavior
    search_spin_yaw: 1.5708
    search_spin_time_allowance_sec: 10.0
    max_search_attempts: 8

    # RViz debug visualization
    visualization_enabled: true
    marker_lifetime_sec: 0.0
    target_marker_scale: 0.15
    goal_marker_length: 0.35
    goal_marker_width: 0.07
    show_direction_line: true
    direction_line_width: 0.03

    # Drop-off box coordinates (target frame)
    box_x: 0.0
    box_y: 0.0

perception_node:
  ros__parameters:
    # Publish at 0.1 Hz -> one detection every 10 seconds.
    publish_rate_hz: 0.1

    # Detection range in source frame
    detection_x_min: 0.5
    detection_x_max: 2.0
    detection_y_min: -1.0
    detection_y_max: 1.0
